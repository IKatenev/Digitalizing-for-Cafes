name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FORM_MODE: ${{ vars.VITE_FORM_MODE || 'demo' }}
      VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run test:chrome
      - name: Configure Lighthouse browser
        run: node --input-type=module -e "import { chromium } from 'playwright'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'CHROME_PATH=' + chromium.executablePath() + '\n');"
      - name: Performance checks
        run: npm run audit:performance -- --assert
        env:
          LIGHTHOUSE_CHROME_FLAGS: --headless=new --no-sandbox --disable-dev-shm-usage
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: validation-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
