<header class="header">
  <div class="header__inner">
    <a href="/" class="logo" aria-label="На главную">
      <picture>
        <source
          srcset="src/assets/icons/logo-mobile.svg"
          media="(max-width: 768px)"
          width="87"
          height="32"
        />

        <!-- Desktop version (default) -->
        <img src="src/assets/icons/logo.svg" alt="%VITE_SITE_TITLE%" width="175" height="36" />
      </picture>
    </a>

    <div class="header__overlay" id="overlay">
      <nav class="header__nav" id="main-nav" aria-label="Главное меню">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a href="#why-us" class="header__nav-link">
              Продукты
              <img src="src/assets/icons/arrow-down.svg" alt="" />
            </a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">
              Типы бизнеса
              <img src="src/assets/icons/arrow-down.svg" alt="" />
            </a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">Почему мы</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">Цены</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link">Партнерам</a>
          </li>
        </ul>
      </nav>

      <a href="#" class="header__login-btn btn btn--transparent visible-laptop" aria-label="Войти">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="11"
          height="11"
          viewBox="0 0 11 11"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5.33333 5.33333C6.80667 5.33333 8 4.14 8 2.66667C8 1.19333 6.80667 0 5.33333 0C3.86 0 2.66667 1.19333 2.66667 2.66667C2.66667 4.14 3.86 5.33333 5.33333 5.33333ZM5.33333 6.66667C3.55333 6.66667 0 7.56 0 9.33333V10.6667H10.6667V9.33333C10.6667 7.56 7.11333 6.66667 5.33333 6.66667Z"
            fill="#323232"
          />
        </svg>
        Войти
      </a>
    </div>
    <div class="header__buttons">
      <a
        href="#"
        class="header__login-btn btn btn--transparent hidden-laptop"
        aria-label="Войти"
        aria-hidden="true"
        tabindex="-1"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="11"
          height="11"
          viewBox="0 0 11 11"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5.33333 5.33333C6.80667 5.33333 8 4.14 8 2.66667C8 1.19333 6.80667 0 5.33333 0C3.86 0 2.66667 1.19333 2.66667 2.66667C2.66667 4.14 3.86 5.33333 5.33333 5.33333ZM5.33333 6.66667C3.55333 6.66667 0 7.56 0 9.33333V10.6667H10.6667V9.33333C10.6667 7.56 7.11333 6.66667 5.33333 6.66667Z"
            fill="#323232"
          />
        </svg>
        Войти
      </a>
      <a href="#" class="header__free-start-btn btn btn--white">Начать бесплатно</a>
    </div>
    <button
      class="header__burger-button burger-button visible-laptop"
      id="burger-btn"
      aria-controls="overlay"
      aria-label="Открыть меню"
      aria-expanded="false"
    >
      <span class="burger-button__line" aria-hidden="true"></span>
      <span class="burger-button__line" aria-hidden="true"></span>
    </button>
  </div>
</header>
