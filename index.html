<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>%VITE_SITE_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESC%" />

    <!-- Open Graph -->
    <meta property="og:title" content="%VITE_SITE_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESC%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />
    <meta property="og:image:alt" content="%VITE_SITE_TITLE%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" href="public/favicon.ico" />
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="public/apple-touch-icon.png" />

    <!-- Font preloading -->
    <!-- <link rel="preload" href="" as="font" type="font/woff2" crossorigin /> -->
  </head>

  <body>
    <!-- Skip-link for accessibility -->
    <a href="#main" class="skip-link sr-only">Перейти к контенту</a>

    <header class="header" role="banner">
      <div class="container">
        <a href="/" class="logo" aria-label="На главную">
          <img src="src/assets/images/logo.svg" alt="%VITE_SITE_TITLE%" width="160" height="40" />
        </a>
      </div>
    </header>

    <main id="main" role="main">
      <div class="container">
        <section class="hero" aria-labelledby="hero-title"></section>
      </div>
    </main>

    <footer class="footer" role="contentinfo"></footer>

    <!-- Main JS -->
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
